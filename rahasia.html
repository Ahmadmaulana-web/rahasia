<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mau Nggak Jadi Pacar Aku?</title>
    <link rel="stylesheet" href="style.css">
    <style>
        
    </style>
</head>
<body>

    <h1>Hai Kamu! ❤️</h1>
    <p>Aku mau ngomong sesuatu nih...</p>
    <p><b>Kamu mau nggak jadi pacar aku?</b></p>

    <div class="btn-container">
        <button id="yesBtn" onclick="sayYes()">Mau Banget!</button>
        <button id="noBtn" onmouseover="moveButton()">Enggak</button>
    </div>

    <script>
        function sayYes() {
            alert("Yeay! Makasih udah jawab iya! ❤️🥰");
            document.body.innerHTML = "<h1 style='color: #d63384; padding-top: 150px;'>I Love You! ❤️✨</h1>";
        }

        function moveButton() {
            const noBtn = document.getElementById("noBtn");
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.position = "absolute";
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }
    </script>

</body>
</html>
